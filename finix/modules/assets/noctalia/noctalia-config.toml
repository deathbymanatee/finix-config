[bar.default]
capsule_thickness = 0.74999998696148396
center = []
end = [ "tray", "clipboard", "notifications", "network", "bluetooth", "volume", "battery", "clock" ]
margin_ends = 0
panel_overlap = 0
position = "bottom"
radius = 0
scale = 1.2500000111758709
start = [ "workspaces", "taskbar" ]
thickness = 40
widget_spacing = 8

[control_center]
hidden_tabs = [ "weather" ]
sidebar = "full"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1128.0
    cy = 1322.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd.kinds]
lock_keys = false

[shell]
offline_mode = true

    [shell.panel]
    clipboard_position = "auto"
    control_center_placement = "floating"
    control_center_position = "bottom_right"
    launcher_position = "bottom_left"
    list_item_background = true
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    command = "sudo reboot"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    command = "sudo poweroff"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "qt" ]

[wallpaper.default]
path = "/home/ryan/Pictures/Wallpapers/foggy_mountains_4k_5k.jpg"

[wallpaper.last]
path = "/home/ryan/Pictures/Wallpapers/foggy_mountains_4k_5k.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/ryan/Pictures/Wallpapers/foggy_mountains_4k_5k.jpg"

[widget.control-center]
glyph = "snowflake"

[widget.network]
show_label = false

[widget.taskbar]
inactive_opacity = 0.84999999999999998
pinned = [ "librewolf", "thunar", "foot" ]
pinned_opacity = 0.75
scale = 1.25
show_all_outputs = true
window_title_max_width = 75

[widget.tray]
drawer = true
pinned = [ "Vesktop" ]

[widget.volume]
show_label = false
