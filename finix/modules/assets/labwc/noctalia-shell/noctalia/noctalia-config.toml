[bar.default]
capsule_thickness = 0.74999998696148396
center = []
end = [ "tray", "clipboard", "notifications", "network", "bluetooth", "volume", "battery", "clock", "control-center" ]
hover_highlight = false
margin_ends = 0
panel_overlap = 0
position = "bottom"
radius = 0
scale = 1.350000012665987
start = [ "launcher", "workspaces", "taskbar" ]
thickness = 45
widget_spacing = 10

[control_center]
hidden_tabs = [ "weather" ]
sidebar = "full"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hooks]
battery_charging = "powerprofilesctl set performance"
battery_discharging = "powerprofilesctl set balanced"
battery_percentage_changed = "low-battery"
battery_plugged = "powerprofilesctl set performance"

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 752.0
    cy = 871.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 752.0
    cy = 405.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "analog"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 752.0
    cy = 597.0
    output = "eDP-1"
    rotation = 0.0
    type = "sysmon"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        stat = "cpu_usage"
        stat2 = "cpu_temp"

[nightlight]
temperature_day = 2500

[osd.kinds]
lock_keys = false

[shell]
clipboard_image_action_command = "satty -f-"
offline_mode = true

    [shell.launcher.providers.session]
    global = true

    [shell.panel]
    clipboard_position = "auto"
    control_center_placement = "floating"
    control_center_position = "bottom_right"
    launcher_position = "bottom_left"
    list_item_background = true
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    command = "sudo reboot"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    command = "sudo poweroff"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "qt" ]

[wallpaper.default]
path = "/home/ryan/Pictures/Wallpapers/foggy_mountains_4k_5k.jpg"

[wallpaper.last]
path = "/home/ryan/Pictures/Wallpapers/foggy_mountains_4k_5k.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/ryan/Pictures/Wallpapers/foggy_mountains_4k_5k.jpg"

[widget.clock]
format = "{:%-I:%M %p}\\n{:%Y-%m-%d}"

[widget.control-center]
enabled = false
glyph = "snowflake"

[widget.network]
show_label = false

[widget.taskbar]
pinned = [ "librewolf", "thunar", "foot" ]
pinned_opacity = 0.75
show_all_outputs = true
show_window_title = true
window_title_max_width = 75

[widget.tray]
drawer = true
pinned = [ "Vesktop" ]

[widget.volume]
show_label = false

[widget.workspaces]
style = "focus_hint"
